title: Unterseite
icon: page

status:
  draft: Entwurf
  listed: Sichtbar

tabs:
  builder:
    label: Seitenaufbau
    icon: layers
    fields:
      builderInfo:
        label: So baust du eine Unterseite
        type: info
        theme: info
        text: >
          Eine Unterseite besteht aus **Sektionen** (Blocks) — genau wie die
          Startseite. Für den Kopf-Bereich wählst du je nach Bedarf einen
          **Hero** (Vollbild Video/Foto), einen **Headline + Bild (Seitenkopf)**
          oder direkt eine andere Sektion. Reihenfolge per Drag & Drop, jede
          Sektion hat eigene Layout-/Icon-Tabs.
      builder:
        label: Sektionen
        type: blocks
        empty: Noch keine Sektion. Klick auf + um die erste anzulegen.
        fieldsets:
          # ---- Seiten-Köpfe / Hero ----
          - hero
          - hero-foto
          - headline-solo
          # ---- Editorial / Text ----
          - editorial-split-intro
          - editorial-plain-2col
          - editorial-image-text
          - editorial-bullet-list
          - highlight-text
          - split-intro
          # ---- Bilder / Medien ----
          - image
          - image-grid
          - work-showcase
          - information-images
          # ---- Spezial / Trenner ----
          - icon-divider
          - question-answers
          - conversion-section

  seo:
    label: SEO
    icon: search
    fields:
      metaDescription:
        label: Meta Description
        type: textarea
        buttons: false
