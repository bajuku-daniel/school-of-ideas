                  lightbulb: Glühbirne
                  lightning: Blitz
                  pencil: Stift
                  puzzle: Puzzle
                  shooting-star: Sternschnuppe
                  spark: Spark
                  sparkles: Sparkles
                  sparkles-line: Sparkles Linie
                  star: Stern
                  starlight: Sternlicht
