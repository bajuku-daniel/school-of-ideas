title: Unterseite
icon: page

status:
  draft: Entwurf
  listed: Sichtbar

tabs:
  builder:
    label: Seitenaufbau
    icon: layers
    fields:
      builderInfo:
        label: Modulare Sektionen
        type: info
        theme: blue
        text: >
          Baue die Seite aus Sektionen. Reihenfolge per Drag & Drop. Auf
          Unterseiten ist KEIN Hero-Block erlaubt — die Seite startet mit
          ihrem regulären Seitenkopf (unten im Tab "Seitenkopf").
      builder:
        label: Sektionen
        type: blocks
        empty: Noch keine Sektion. Klick auf + um die erste anzulegen.
        fieldsets:
          - split-intro
          - highlight-text
          - headline-solo
          - editorial-split-intro
          - editorial-plain-2col
          - editorial-image-text
          - editorial-bullet-list
          - image
          - image-grid
          - information-images
          - icon-divider
          - question-answers
          - conversion-section

  hero:
    label: Seitenkopf
    icon: text
    fields:
      heroInfo:
        label: Seitenkopf (über dem Builder)
        type: info
        theme: blue
        text: Wird oberhalb der Sektionen angezeigt — Kicker, Headline, optionaler Introtext.
      kicker:
        label: Kicker
        type: text
        width: 1/2
      headlineInk:
        label: Headline schwarz
        type: textarea
        buttons: false
        width: 1/2
      headlineAccent:
        label: Headline blau (optional)
        type: textarea
        buttons: false
        width: 1/2
      intro:
        label: Introtext
        type: textarea

  seo:
    label: SEO
    icon: search
    fields:
      metaDescription:
        label: Meta Description
        type: textarea
        buttons: false
