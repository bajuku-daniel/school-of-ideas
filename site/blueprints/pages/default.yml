title: Unterseite
icon: page

status:
  draft: Entwurf
  listed: Sichtbar

tabs:
  content:
    label: Inhalt
    icon: layers
    fields:
      pageIntro:
        label: Seitenkopf
        type: headline
      headline:
        label: Headline
        type: text
      intro:
        label: Introtext
        type: textarea
        buttons: false
      sectionsInfo:
        label: Sektionen bauen
        type: info
        theme: blue
        text: >
          Füge Sektionen hinzu und sortiere sie per Drag & Drop. Jede Sektion kann eigene Abstände,
          Farben, Bild und CTA haben. Leer gelassene Felder werden im Template übersprungen.
      sections:
        label: Sektionen
        type: structure
        columns:
          title:
            width: 1/3
          type:
            width: 1/4
          spacingTop:
            width: 1/6
          spacingBottom:
            width: 1/6
        fields:
          title:
            label: Interner Name
            type: text
            help: Nur fürs Panel, z. B. "Intro Text" oder "Bewerbungs-CTA".
          type:
            label: Sektionstyp
            type: select
            default: text
            options:
              text: Text
              imageText: Bild + Text
              cards: Karten
              cta: CTA
              spacer: Nur Abstand
          theme:
            label: Hintergrund
            type: toggles
            default: light
            width: 1/2
            options:
              light: Hell
              mint: Mint
              blue: Blau
          align:
            label: Ausrichtung
            type: toggles
            default: left
            width: 1/2
            options:
              left: Links
              center: Zentriert
          kicker:
            label: Kicker
            type: text
          heading:
            label: Headline
            type: text
          text:
            label: Text
            type: textarea
            help: Absätze mit einer Leerzeile trennen.
          image:
            label: Bild
            type: files
            max: 1
            uploads: image
            layout: cards
            image:
              cover: true
          cards:
            label: Karten
            type: structure
            fields:
              heading:
                label: Titel
                type: text
              text:
                label: Text
                type: textarea
                buttons: false
          buttonText:
            label: Button Text
            type: text
            width: 1/2
          buttonUrl:
            label: Button Link
            type: text
            width: 1/2
          spacingTop:
            label: Abstand oben
            type: select
            default: normal
            width: 1/2
            options:
              none: Kein Abstand
              small: Klein
              normal: Normal
              large: Groß
              xlarge: Sehr groß
          spacingBottom:
            label: Abstand unten
            type: select
            default: normal
            width: 1/2
            options:
              none: Kein Abstand
              small: Klein
              normal: Normal
              large: Groß
              xlarge: Sehr groß

  seo:
    label: SEO
    icon: search
    fields:
      metaDescription:
        label: Meta Description
        type: textarea
        buttons: false
