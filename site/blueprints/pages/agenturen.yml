              # ---- Editorial / Text ----
              - editorial-split-intro
              - editorial-plain-2col
              - editorial-image-text
              - editorial-bullet-list
              - highlight-text
              - split-intro
              # ---- Bilder / Medien ----
              - image
              - image-grid
              - information-images
              # ---- Spezial / Trenner ----
              - icon-divider
              - question-answers
              - conversion-section
