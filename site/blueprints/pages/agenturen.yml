title: Agenturen-Übersicht
icon: grid

status:
  draft: Entwurf
  listed: Sichtbar

tabs:
  builder:
    label: Seitenaufbau
    icon: layers
    columns:
      main:
        width: 2/3
        fields:
          builderInfo:
            label: Modulare Übersichts-Seite
            type: info
            theme: blue
            text: >
              Die Agenturen-Übersicht besteht aus 3 wiederkehrenden Sektionen:
              (1) Basic-Page-Header mit Bild + Schatten, (2) Agentur-Grid mit
              Filter, (3) Conversion-Section mit Buttons. Die Filter und das
              Grid füllen sich automatisch aus den Agentur-Unterseiten rechts.
          builder:
            label: Sektionen
            type: blocks
            empty: Sektionen hinzufügen
            fieldsets:
              - split-intro
              - image
              - agency-grid
              - conversion-section
              - icon-divider
              - editorial-split-intro
      sidebar:
        width: 1/3
        sections:
          agencies:
            label: Agentur-Unterseiten
            type: pages
            template: agency

  hero:
    label: Seitenkopf
    icon: text
    fields:
      heroInfo:
        label: Seitenkopf
        type: info
        theme: blue
        text: Wird über den Builder-Sektionen angezeigt.
      kicker:
        label: Kicker
        type: text
        width: 1/2
      headlineInk:
        label: Headline schwarz
        type: textarea
        buttons: false
        width: 1/2
      headlineAccent:
        label: Headline blau
        type: textarea
        buttons: false
        width: 1/2
      intro:
        label: Introtext
        type: textarea
        buttons: false

  seo:
    label: SEO
    icon: search
    fields:
      metaDescription:
        label: Meta Description
        type: textarea
        buttons: false
