title: Agentur
icon: building

status:
  draft: Entwurf
  listed: Sichtbar

tabs:
  # --------------------------------------------------------------------
  # Tab 1: Sektionen (Builder) — die Hauptarbeit für die Detailseite
  # --------------------------------------------------------------------
  builder:
    label: Seitenaufbau
    icon: layers
    fields:
      builderInfo:
        label: So baust du eine Agentur-Detailseite
        type: info
        theme: info
        text: >
          Der **Seitenkopf** wird automatisch gerendert: Der Page-Titel
          (siehe unten links) als große Headline, das Logo/Bild aus den
          Stammdaten als Polaroid rechts.
          Alle weiteren Sektionen baust du hier mit Blöcken zusammen.
          Filter-Daten (Standort, Schwerpunkte, etc.) pflegst du im Tab
          **Stammdaten** — die werden für die Übersichts-Seite gebraucht.
      builder:
        label: Sektionen
        type: blocks
        empty: Noch keine Sektion. Klick auf + um die erste anzulegen.
        fieldsets:
          - headline-solo
          - editorial-split-intro
          - editorial-plain-2col
          - editorial-image-text
          - editorial-bullet-list
          - highlight-text
          - split-intro
          - image
          - image-grid
          - work-showcase
          - information-images
          - icon-divider
          - question-answers
          - conversion-section

  # --------------------------------------------------------------------
  # Tab 2: Stammdaten — Logo, Filter, Kontakt (alles für das Grid)
  # --------------------------------------------------------------------
  meta:
    label: Stammdaten
    icon: settings
    columns:
      main:
        width: 2/3
        fields:
          stammInfo:
            label: Was hier rein gehört
            type: info
            theme: info
            text: >
              Diese Daten brauchen wir für die **Übersichts-Seite**
              (Agenturen-Grid mit Filter). Das Bild + die Filter-Daten
              werden dort gezeigt, plus auf der Detailseite automatisch
              im Seitenkopf (Polaroid rechts).

          logo:
            label: Logo / Tile-Bild
            help: >
              Wird auf der Übersichts-Seite als Grid-Tile und auf der
              Detailseite oben rechts im Polaroid-Look gezeigt.
            type: files
            max: 1
            uploads: image
            layout: cards
            image:
              cover: true

          intro:
            label: Kurz-Intro (für Grid-Tile)
            type: textarea
            buttons: false
            help: >
              Erscheint im Übersichts-Grid unter dem Bild.
              Z. B. „Erfahre mehr über die Social Agentur aus Hamburg."

          contactRow:
            label: Kontakt
            type: headline
          website:
            label: Website
            type: url
            width: 1/2
          contactEmail:
            label: Kontakt E-Mail
            type: email
            width: 1/2

      filters:
        width: 1/3
        fields:
          filterInfo:
            label: Filter-Daten
            type: info
            theme: positive
            text: >
              Diese Felder steuern, in welchen Kategorien die Agentur
              im Übersichts-Filter erscheint.
          location:
            label: Standort
            type: select
            options:
              Berlin: Berlin
              Düsseldorf: Düsseldorf
              Frankfurt: Frankfurt
              Hamburg: Hamburg
              Köln: Köln
              München: München
              Stuttgart: Stuttgart
              Zürich: Zürich
          arbeitsweise:
            label: Arbeitsweise
            type: select
            empty: "—"
            options:
              onsite: Onsite
              hybrid: Hybrid
              remote: Remote
          groesse:
            label: Agenturgröße
            type: select
            empty: "—"
            options:
              "5-10":   5–10 Mitarbeitende
              "10-50":  10–50 Mitarbeitende
              "50-100": 50–100 Mitarbeitende
              "100-200": 100–200 Mitarbeitende
              "200+":   200+ Mitarbeitende
          setup:
            label: Setup
            type: select
            empty: "—"
            options:
              Netzwerkagentur: Netzwerkagentur
              Independent: Independent
              Studio: Studio
              Spezialagentur: Spezialagentur
          schwerpunkte:
            label: Schwerpunkte
            type: tags
            options:
              Strategie: Strategie
              Branding: Branding
              Kampagnen: Kampagnen
              Social Media: Social Media
              Influencer Marketing: Influencer Marketing
              Web/Digital: Web/Digital
              Design: Design
              Content: Content
              PR: PR
              Employer Branding: Employer Branding
              Events: Events
              Produktion: Produktion

  # --------------------------------------------------------------------
  # Tab 3: SEO
  # --------------------------------------------------------------------
  seo:
    label: SEO
    icon: search
    fields:
      metaDescription:
        label: Meta Description
        type: textarea
        buttons: false
