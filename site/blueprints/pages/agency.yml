title: Agentur
icon: building

status:
  draft: Entwurf
  listed: Sichtbar

tabs:
  content:
    label: Stammdaten
    icon: text
    columns:
      main:
        width: 2/3
        fields:
          headline:
            label: Headline (kurz)
            type: text
          headlineInk:
            label: Headline schwarz
            type: textarea
            buttons: false
            width: 1/2
          headlineAccent:
            label: Headline blau
            type: textarea
            buttons: false
            width: 1/2
          intro:
            label: Kurzbeschreibung
            type: textarea
            buttons: false
          body:
            label: Über die Agentur
            type: textarea
          cards:
            label: Info-Karten
            type: structure
            fields:
              icon:
                label: Icon
                type: select
                empty: Kein Icon
                options:
                  airplane: Papierflieger
                  bag: Tasche
                  bottle: Flasche
                  cloud: Wolke
                  comet: Komet
                  document: Dokument
                  glasses-bold: Brille fett
                  glasses: Brille
                  leaf: Blatt
                  lightbulb: Glühbirne
                  lightning: Blitz
                  pencil: Stift
                  puzzle: Puzzle
                  shooting-star: Sternschnuppe
                  spark: Spark
                  sparkles: Sparkles
                  sparkles-line: Sparkles Linie
                  star: Stern
                  starlight: Sternlicht
                  swirl: Wirbel
              heading:
                label: Titel
                type: text
              text:
                label: Text
                type: textarea
          website:
            label: Website
            type: url
            width: 1/2
          contactEmail:
            label: Kontakt E-Mail
            type: email
            width: 1/2
      meta:
        width: 1/3
        fields:
          logo:
            label: Logo / Bild (für Grid-Tile)
            type: files
            max: 1
            uploads: image
            layout: cards
            image:
              cover: true
          location:
            label: Standort (Filter)
            type: select
            options:
              Berlin: Berlin
              Düsseldorf: Düsseldorf
              Frankfurt: Frankfurt
              Hamburg: Hamburg
              Köln: Köln
              München: München
              Stuttgart: Stuttgart
              Zürich: Zürich
          arbeitsweise:
            label: Arbeitsweise (Filter)
            type: select
            empty: "—"
            options:
              onsite: Onsite
              hybrid: Hybrid
              remote: Remote
          groesse:
            label: Agenturgröße (Filter)
            type: select
            empty: "—"
            options:
              "5-10":   5–10 Mitarbeitende
              "10-50":  10–50 Mitarbeitende
              "50-100": 50–100 Mitarbeitende
              "100-200": 100–200 Mitarbeitende
              "200+":   200+ Mitarbeitende
          schwerpunkte:
            label: Schwerpunkte (Filter)
            type: tags
            options:
              Strategie: Strategie
              Branding: Branding
              Kampagnen: Kampagnen
              Social Media: Social Media
              Influencer Marketing: Influencer Marketing
              Web/Digital: Web/Digital
              Design: Design
              Content: Content
              PR: PR
              Employer Branding: Employer Branding
              Events: Events
              Produktion: Produktion
          discipline:
            label: Haupt-Schwerpunkt (alt)
            type: select
            empty: "—"
            options:
              Strategie: Strategie
              Design: Design
              Kampagne: Kampagne
              Digital: Digital
              Social: Social
              Film: Film
            help: Legacy-Feld. Lieber "Schwerpunkte" oben pflegen.
          setup:
            label: Setup
            type: select
            empty: "—"
            options:
              Netzwerkagentur: Netzwerkagentur
              Independent: Independent
              Studio: Studio
              Spezialagentur: Spezialagentur
          gridHeadline:
            label: Position im Übersichts-Grid
            type: info
            theme: positive
            text: >
              Die Position im 4-Spalten-Raster ergibt sich automatisch aus der
              Reihenfolge der Agenturen in der Sidebar. Das Pattern wiederholt
              sich alle 4 Zeilen — keine manuelle Einstellung nötig.
          intro:
            label: Kurz-Intro (für Grid-Tile)
            type: textarea
            buttons: false
            help: Text der unter dem Bild im Übersichts-Grid steht. Z. B. „Erfahre mehr über die Social Agentur aus Hamburg.".

  builder:
    label: Zusatz-Sektionen
    icon: layers
    fields:
      builderInfo:
        label: Optionale Sektionen
        type: info
        theme: blue
        text: >
          Falls die Agentur-Detailseite zusätzliche Inhalte braucht
          (z. B. Galerie, Q&A, weitere Bilder mit Schatten). Stammdaten
          bleiben im ersten Tab.
      builder:
        label: Sektionen
        type: blocks
        fieldsets:
          - split-intro
          - editorial-split-intro
          - editorial-bullet-list
          - image
          - image-grid
          - work-showcase
          - icon-divider
          - question-answers
          - conversion-section

  seo:
    label: SEO
    icon: search
    fields:
      metaDescription:
        label: Meta Description
        type: textarea
        buttons: false
