title: Landingpage
icon: home

status:
  draft: Entwurf
  listed: Sichtbar

tabs:
  builder:
    label: Seitenaufbau
    icon: layers
    fields:
      builderInfo:
        label: Modulare Sektionen
        type: info
        theme: blue
        text: >
          Hier baust du die ganze Seite aus Sektionen zusammen. Reihenfolge per
          Drag & Drop. Jede Sektion hat ihre eigenen Einstellungen für Inhalt,
          Abstände, Hintergrund und ein optionales Icon mit Per-Breakpoint-Position.
      builder:
        label: Sektionen
        type: blocks
        empty: Noch keine Sektion. Klick auf + um die erste anzulegen.
        fieldsets:
          - hero
          - hero-foto
          - split-intro
          - highlight-text
          - headline-solo
          - editorial-split-intro
          - editorial-plain-2col
          - editorial-image-text
          - editorial-bullet-list
          - image
          - image-grid
          - information-images
          - icon-divider
          - question-answers
          - conversion-section

  navigation:
    label: Navigation
    icon: menu
    fields:
      navInfo:
        label: Hauptnavigation
        type: info
        theme: blue
        text: Wird im Header der Landingpage UND auf allen Unterseiten angezeigt.
      navItems:
        label: Menüpunkte
        type: structure
        fields:
          label:
            label: Beschriftung
            type: text
            width: 1/2
          url:
            label: Link
            type: text
            width: 1/2
      ctaHeadline:
        label: Bewerbungs-Button
        type: headline
      ctaLabel:
        label: Button-Text
        type: text
        width: 1/2
      ctaUrl:
        label: Button-Link
        type: text
        width: 1/2

  footer:
    label: Footer
    icon: text
    fields:
      footerClaimInk:
        label: Claim (schwarz)
        type: text
        width: 1/2
      footerClaimAccent:
        label: Claim (blau)
        type: text
        width: 1/2
      footerLinksHead:
        label: Footer-Navigation
        type: headline
      footerLinks:
        label: Footer-Links
        type: structure
        fields:
          label:
            label: Beschriftung
            type: text
            width: 1/2
          url:
            label: Link
            type: text
            width: 1/2
      legalHead:
        label: Rechtliches
        type: headline
      legalLinks:
        label: Legal-Links
        type: structure
        fields:
          label:
            label: Beschriftung
            type: text
            width: 1/2
          url:
            label: Link
            type: text
            width: 1/2

  seo:
    label: SEO
    icon: search
    fields:
      metaTitle:
        label: Title-Tag (SEO, überschreibt Standard)
        type: text
        help: >
          Wenn gefüllt, wird dieser Text 1:1 als Browser-Titel (<title>)
          ausgegeben, z. B. "School of Ideas | Kreativ Upgrade für Creative
          Talents". Leer = automatischer Titel.
      metaDescription:
        label: Meta Description
        type: textarea
        buttons: false
