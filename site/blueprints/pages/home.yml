title: Landingpage
icon: home

status:
  draft: Entwurf
  listed: Sichtbar

tabs:
  hero:
    label: Hero + Intro
    icon: wand
    columns:
      main:
        width: 2/3
        fields:
          heroInfo:
            label: Was sehe ich hier?
            type: info
            theme: blue
            text: >
              Diese Felder steuern den ersten sichtbaren Bereich der Landingpage.
              Alle aktuellen Inhalte sind vorausgefüllt. Änderungen sind sofort auf der Website sichtbar.
          heroLine1:
            label: "Hero: erste Zeile"
            type: text
            width: 1/1
          heroLine2Prefix:
            label: "Hero: zweite Zeile vor dem Icon"
            type: text
            width: 1/2
          heroIcon:
            label: "Hero: Icon zwischen den Wörtern"
            type: select
            width: 1/2
            default: shooting-star
            options:
              shooting-star: Sternschnuppe
              star: Stern
              sparkles: Sparkles
              airplane: Papierflieger
              lightning: Blitz
              lightbulb: Glühbirne
          heroLine2Suffix:
            label: "Hero: zweite Zeile nach dem Icon"
            type: text
            width: 1/2
          introHeadlineInk:
            label: Intro Headline schwarz
            type: textarea
            buttons: false
            width: 1/2
            help: Zeilenumbrüche bleiben erhalten.
          introHeadlineAccent:
            label: Intro Headline blau
            type: textarea
            buttons: false
            width: 1/2
            help: Zeilenumbrüche bleiben erhalten.
          introSub:
            label: Intro Subline
            type: textarea
            buttons: false
          introBody:
            label: Intro Fließtext
            type: textarea
            help: Absätze mit einer Leerzeile trennen. Der erste Absatz wird etwas kräftiger dargestellt.
      media:
        width: 1/3
        fields:
          heroPoster:
            label: Hero Posterbild
            type: files
            max: 1
            uploads: image
            layout: cards
            image:
              cover: true
          heroVideo:
            label: Hero Video
            type: files
            max: 1
            uploads: video
            help: Desktop / große Viewports.
          heroVideoMobile:
            label: Hero Video Mobile
            type: files
            max: 1
            uploads: video
            help: Für Smartphones. Leer lassen = kleine Default-Datei aus public/video/hero.mp4.
          introImage:
            label: Intro Bild
            type: files
            max: 1
            uploads: image
            layout: cards
            image:
              cover: true

  sections:
    label: Textsektionen
    icon: text
    fields:
      manifestHeadline:
        label: Manifest
        type: headline
      manifest:
        label: Manifest Absätze mit Inline-Icons
        type: structure
        columns:
          text:
            width: 1/1
        fields:
          text:
            label: Text
            type: textarea
            buttons: false
            help: >
              Icons im Text mit Tokens setzen, z. B. {icon:airplane}. Erlaubt sind:
              airplane, shooting-star, bottle, glasses-bold, lightbulb, spark, star, sparkles.

      expectLine:
        type: line
      expectHeadline:
        label: Was dich erwartet
        type: headline
      expectHeadlineInk:
        label: Headline schwarz
        type: text
        width: 1/2
      expectHeadlineAccent:
        label: Headline blau
        type: text
        width: 1/2
      expectSub:
        label: Subline
        type: textarea
        buttons: false
        width: 1/2
      expectBody:
        label: Fließtext
        type: textarea
        width: 1/2

      yearLine:
        type: line
      yearHeadline:
        label: So sieht dein Jahr aus
        type: headline
      yearHeadlineInk:
        label: Headline schwarz
        type: text
        width: 1/2
      yearHeadlineAccent:
        label: Headline blau
        type: text
        width: 1/2
      yearBlocks:
        label: Jahr Textblöcke
        type: structure
        columns:
          lead:
            width: 1/2
          body:
            width: 1/2
        fields:
          lead:
            label: Fett gesetzter Einstieg
            type: textarea
            buttons: false
          body:
            label: Text
            type: textarea
            help: Absätze mit einer Leerzeile trennen.

      valuesLine:
        type: line
      valuesHeadline:
        label: Was heute zählt
        type: headline
      valuesHeadlineInk:
        label: Headline schwarz
        type: text
        width: 1/2
      valuesHeadlineAccent:
        label: Headline blau
        type: text
        width: 1/2
      valuesColumns:
        label: Textspalten
        type: structure
        columns:
          lead:
            width: 1/3
          body:
            width: 2/3
        fields:
          lead:
            label: Lead in der Spalte
            type: textarea
            buttons: false
          body:
            label: Fließtext in der Spalte
            type: textarea

  cards:
    label: Karten + CTA
    icon: grid
    fields:
      audienceHeadline:
        label: Für wen das Sinn macht
        type: headline
      audienceHeadlineInk:
        label: Headline schwarz
        type: text
        width: 1/2
      audienceHeadlineAccent:
        label: Headline blau
        type: text
        width: 1/2
      audienceSub:
        label: Subline
        type: textarea
        buttons: false
      audienceCards:
        label: Zielgruppen-Karten
        type: structure
        columns:
          text:
            width: 3/4
          col:
            width: 1/8
          row:
            width: 1/8
        fields:
          text:
            label: Kartentext
            type: textarea
            buttons: false
          col:
            label: Desktop-Spalte
            type: number
            min: 1
            max: 4
            help: Nur Desktop-Layout.
          row:
            label: Desktop-Zeile
            type: number
            min: 1

      outcomeLine:
        type: line
      outcomeHeadline:
        label: Was du mitnimmst
        type: headline
      outcomeHeadlineInk:
        label: Headline schwarz
        type: text
        width: 1/2
      outcomeHeadlineAccent:
        label: Headline blau
        type: text
        width: 1/2
      outcomeCards:
        label: Outcome-Karten
        type: structure
        columns:
          text:
            width: 3/4
          col:
            width: 1/8
          row:
            width: 1/8
        fields:
          text:
            label: Kartentext
            type: textarea
            buttons: false
          col:
            label: Desktop-Spalte
            type: number
            min: 1
            max: 4
          row:
            label: Desktop-Zeile
            type: number
            min: 1

      finalLine:
        type: line
      finalHeadline:
        label: Schluss-CTA
        type: headline
      finalHeadlineInk:
        label: Headline schwarz
        type: text
        width: 1/2
      finalHeadlineAccent:
        label: Headline blau
        type: text
        width: 1/2
      finalCards:
        label: CTA-Karten
        type: structure
        columns:
          title:
            width: 1/2
          buttonText:
            width: 1/4
          buttonStyle:
            width: 1/4
        fields:
          title:
            label: Kartentitel
            type: textarea
            buttons: false
          text:
            label: Text statt Button
            type: textarea
            buttons: false
          buttonText:
            label: Button Text
            type: text
          buttonUrl:
            label: Button Link
            type: text
          buttonStyle:
            label: Button Stil
            type: toggles
            default: mint
            options:
              mint: Mint
              ghost: Outline
              none: Kein Button

  media:
    label: Medien
    icon: image
    fields:
      mediaInfo:
        label: Bilder auf der Seite
        type: info
        theme: positive
        text: >
          Die aktuellen Bilder und das Video sind bereits bei dieser Seite hinterlegt.
          Du kannst sie hier austauschen. Neue Uploads landen direkt bei der Landingpage.
      expectImage:
        label: "Bild: Was dich erwartet"
        type: files
        max: 1
        uploads: image
        layout: cards
        image:
          cover: true
        width: 1/3
      yearImage:
        label: "Bild: Dein Jahr"
        type: files
        max: 1
        uploads: image
        layout: cards
        image:
          cover: true
        width: 1/3
      finalImage:
        label: "Bild: Schluss-CTA"
        type: files
        max: 1
        uploads: image
        layout: cards
        image:
          cover: true
        width: 1/3

  icons:
    label: Icons
    icon: star
    fields:
      iconInfo:
        label: Icon Machine
        type: info
        theme: blue
        text: >
          Hier definierst du Icons einmal zentral. Jedes Icon hat einen technischen Namen
          wie airplane oder shooting-star und eine hochgeladene SVG/PNG-Datei mit Vorschau.
          Danach kannst du den Namen im Manifest als {icon:airplane} verwenden oder unten
          einem festen Design-Slot zuweisen.
      iconMode:
        label: Icon-Ausgabe
        type: toggles
        default: upload
        options:
          upload: Uploads aus der Icon Machine
          svg: Alte SVGs aus /public/icons
        help: Empfohlen ist Uploads. Die alten SVGs sind nur als Fallback/Testmodus gedacht.
      iconLibraryHeadline:
        label: Icon-Bibliothek
        type: headline
      iconLibrary:
        label: Icons definieren
        type: structure
        columns:
          label:
            width: 1/3
          key:
            width: 1/3
          iconFile:
            width: 1/3
        fields:
          label:
            label: Name im Panel
            type: text
            width: 1/2
          key:
            label: Technischer Name
            type: slug
            width: 1/2
            help: Dieser Name wird im Text verwendet, z. B. {icon:airplane}.
          iconFile:
            label: SVG oder PNG
            type: files
            max: 1
            uploads:
              template: image
            layout: cards
            image:
              cover: false
              back: white
            help: Am besten SVG oder transparentes PNG hochladen.
      decorativeHeadline:
        label: Icon-Slots im Layout
        type: headline
      decorativeIcons:
        label: Dekorative Icons auf der Seite
        type: structure
        columns:
          label:
            width: 1/3
          slot:
            width: 1/3
          icon:
            width: 1/3
        fields:
          label:
            label: Verständlicher Name
            type: text
            help: Nur fürs Panel.
          slot:
            label: Position auf der Seite
            type: select
            options:
              float-icon--lightning: Intro links
              float-icon--airplane: Intro rechts
              float-icon--ex-airplane: Erwartet links
              float-icon--ex-star: Erwartet Stern
              float-icon--ex-bottle: Erwartet rechts
              float-icon--yr-spark: Jahr Spark
              float-icon--yr-sparkles: Jahr Sparkles
              float-icon--yr-document: Jahr rechts
              float-icon--au-shooting: Zielgruppe Sternschnuppe
              float-icon--au-comet: Zielgruppe Stern
              float-icon--au-airplane: Zielgruppe Papierflieger
              float-icon--au-spark: Zielgruppe Spark
              float-icon--ou-sparkles: Outcome Sparkles
              float-icon--ct-document: CTA links
              float-icon--ct-shooting: CTA Sternschnuppe
              float-icon--ct-bottle: CTA rechts
              float-icon--ct-glasses: CTA Brille
          icon:
            label: Icon
            type: select
            options:
              airplane: Papierflieger
              bottle: Flasche
              cloud: Wolke
              comet: Komet
              document: Dokument
              glasses-bold: Brille fett
              glasses: Brille
              leaf: Blatt
              lightbulb: Glühbirne
              lightning: Blitz
              pencil: Stift
              puzzle: Puzzle
              shooting-star: Sternschnuppe
              spark: Spark
              sparkles: Sparkles
              sparkles-line: Sparkles Linie
              star: Stern
              starlight: Sternlicht
              swirl: Wirbel

  spacing:
    label: Abstände
    icon: expand
    fields:
