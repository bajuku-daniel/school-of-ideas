# Shared Shadow-Tab für Bild-Blocks (image, hero-foto, etc.) — steuert den
# blauen Backdrop-Shadow per Breakpoint (Offset X/Y + Rotation + Bild-Rotation).
label: Bild-Schatten
icon: shape
fields:
  shadowInfo:
    label: Blauer Schlagschatten — was ist das?
    type: info
    theme: blue
    text: >
      Der Schatten ist das **versetzte blaue Rechteck hinter dem Bild** —
      Designer-Effekt für mehr Tiefe. Du kannst pro Breakpoint einstellen
      wie weit es **verschoben** ist (X/Y) und wie **gedreht** (°).
      Zusätzlich kannst du das **Bild selbst** drehen (Polaroid-Look).
      **+X = nach rechts**, **+Y = nach unten**, **+° = im Uhrzeigersinn**.
      Werte leer = Default greift. Animation läuft automatisch beim Scrollen.
  mobileShadowHead:
    label: Mobile
    type: headline
  shadowXMobile:
    label: Schatten X
    type: number
    after: px
    width: 1/4
  shadowYMobile:
    label: Schatten Y
    type: number
    after: px
    width: 1/4
  shadowRotateMobile:
    label: Schatten °
    type: number
    after: °
    width: 1/4
  motivRotateMobile:
    label: Bild °
    type: number
    after: °
    width: 1/4
  tabletShadowHead:
    label: Tablet
    type: headline
  shadowXTablet:
    label: Schatten X
    type: number
    after: px
    width: 1/4
  shadowYTablet:
    label: Schatten Y
    type: number
    after: px
    width: 1/4
  shadowRotateTablet:
    label: Schatten °
    type: number
    after: °
    width: 1/4
  motivRotateTablet:
    label: Bild °
    type: number
    after: °
    width: 1/4
  desktopShadowHead:
    label: Desktop
    type: headline
  shadowXDesktop:
    label: Schatten X
    type: number
    after: px
    width: 1/4
  shadowYDesktop:
    label: Schatten Y
    type: number
    after: px
    width: 1/4
  shadowRotateDesktop:
    label: Schatten °
    type: number
    after: °
    width: 1/4
  motivRotateDesktop:
    label: Bild °
    type: number
    after: °
    width: 1/4
