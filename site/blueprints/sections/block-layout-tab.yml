# Shared Layout-Tab für jeden Block.
# Wird via `extends: sections/block-layout-tab` aus Block-Blueprints geladen.
# Liefert: Hintergrund-Theme, Anker-ID, Abstände (oben/unten × Mobile/Tablet/Desktop).
label: Layout
icon: dashboard
fields:
  layoutInfo:
    label: Was steckt im Layout-Tab?
    type: info
    theme: blue
    text: >
      Hier kannst du die **Sektion grob im Seitenfluss** anpassen:
      Hintergrundfarbe, Sprung-Anker für Links wie `#about`, und wie viel Luft
      die Sektion oben und unten zur nächsten Sektion hat.
      Felder leer = Default-Wert greift (für jede BP unterschiedlich, sinnvoll
      voreingestellt).
  sectionTheme:
    label: Hintergrundfarbe
    type: toggles
    default: light
    width: 1/2
    options:
      light: Hell (Weiß)
      mint: Mint (helles Grün)
      blue: Blau
    help: >
      Färbt den gesamten Hintergrund der Sektion. Texte passen sich an
      (heller Hintergrund = schwarzer Text usw.).
  anchorId:
    label: Anker-ID (für #-Links)
    type: text
    width: 1/2
    placeholder: z. B. about
    help: >
      Wenn gesetzt, kannst du auf diese Sektion mit `#about` (oder was du hier
      einträgst) in einem Link springen.
  spacingHeadline:
    label: Abstand oben — wie viel Luft zur vorherigen Sektion?
    type: headline
  spacingTopHelp:
    label: Pro Breakpoint einstellbar
    type: info
    theme: none
    text: >
      Werte in Pixeln. Leer lassen = sinnvoller Default. Mobile-Wert gilt
      auf Handy (≤ 768px), Tablet-Wert auf Tablet (769–1199px), Desktop-Wert
      auf größeren Bildschirmen (≥ 1200px).
  spacingTopMobile:
    label: Mobile
    type: number
    after: px
    width: 1/3
  spacingTopTablet:
    label: Tablet
    type: number
    after: px
    width: 1/3
  spacingTopDesktop:
    label: Desktop
    type: number
    after: px
    width: 1/3
  spacingBottomHeadline:
    label: Abstand unten — wie viel Luft zur nächsten Sektion?
    type: headline
  spacingBottomMobile:
    label: Mobile
    type: number
    after: px
    width: 1/3
  spacingBottomTablet:
    label: Tablet
    type: number
    after: px
    width: 1/3
  spacingBottomDesktop:
    label: Desktop
    type: number
    after: px
    width: 1/3

  subGapHeadline:
    label: Abstand Headline → blauer Sub-Text
    type: headline
  subGapInfo:
    label: Wo wirkt das?
    type: info
    theme: none
    text: >
      Steuert den Abstand zwischen der schwarz+blauen Hauptheadline und
      dem **blauen Sub-Text** direkt darunter (z. B. bei Bullet-List,
      Audience, Outcome). Leer = Block-Default.
      Wirkt nur in Sektionen mit Sub-Text.
  subGapMobile:
    label: Mobile
    type: number
    after: px
    width: 1/3
  subGapTablet:
    label: Tablet
    type: number
    after: px
    width: 1/3
  subGapDesktop:
    label: Desktop
    type: number
    after: px
    width: 1/3

  bodyGapHeadline:
    label: Abstand Headline → Inhaltsbereich (Cards / Grid / Text)
    type: headline
  bodyGapInfo:
    label: Wo wirkt das?
    type: info
    theme: none
    text: >
      Steuert den Abstand zwischen dem ganzen Headline-Bereich (Headline +
      ggf. Sub) und dem **Inhalt darunter** (Bullet-Cards, Text-Spalten,
      Bild-Block …). Leer = Block-Default.
  bodyGapMobile:
    label: Mobile
    type: number
    after: px
    width: 1/3
  bodyGapTablet:
    label: Tablet
    type: number
    after: px
    width: 1/3
  bodyGapDesktop:
    label: Desktop
    type: number
    after: px
    width: 1/3
