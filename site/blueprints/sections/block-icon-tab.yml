# Shared Section-Icon Tab. Bis zu 3 Uploads (Mobile/Tablet/Desktop) +
# Position/Größe/Rotation pro Breakpoint + Animation.
# Wird via `extends: sections/block-icon-tab` aus Block-Blueprints geladen.
label: Section-Icon
icon: star
fields:
  iconInfo:
    label: Optionales Dekor-Icon
    type: info
    theme: blue
    text: >
      Zwei Wege: (1) Aus der mitgelieferten Bibliothek wählen — dann wird das
      passende Bild automatisch aus /icons/PNG/<mobile|tablet|desktop>/ geladen.
      (2) Eigene PNGs pro Breakpoint hochladen (Override).
      Eigene Uploads gewinnen immer.
  iconKey:
    extends: fields/icon-key
  uploadHead:
    label: Eigene Uploads (Override pro Breakpoint)
    type: headline
  iconMobile:
    label: Icon Mobile
    type: files
    max: 1
    uploads: image
    layout: cards
    width: 1/3
  iconTablet:
    label: Icon Tablet
    type: files
    max: 1
    uploads: image
    layout: cards
    width: 1/3
  iconDesktop:
    label: Icon Desktop
    type: files
    max: 1
    uploads: image
    layout: cards
    width: 1/3
  motionHead:
    label: Animation
    type: headline
  iconMotion:
    label: Bewegung
    type: toggles
    default: wobble
    width: 1/2
    options:
      none: Keine
      wobble: Waber (4 Richtungen)
      glide: Glide (sanft)
  iconMotionDuration:
    label: Dauer
    type: number
    step: 0.1
    after: s
    placeholder: 6.5
    width: 1/4
  iconMotionDelay:
    label: Verzögerung
    type: number
    step: 0.1
    after: s
    placeholder: 0
    width: 1/4
  mobilePosHead:
    label: Position + Größe (Mobile)
    type: headline
  iconMobileX:
    label: X
    type: number
    after: px
    width: 1/4
  iconMobileY:
    label: Y
    type: number
    after: px
    width: 1/4
  iconMobileSize:
    label: Größe
    type: number
    after: px
    width: 1/4
  iconMobileRotate:
    label: Rotation
    type: number
    after: °
    width: 1/4
  tabletPosHead:
    label: Position + Größe (Tablet)
    type: headline
  iconTabletX:
    label: X
    type: number
    after: px
    width: 1/4
  iconTabletY:
    label: Y
    type: number
    after: px
    width: 1/4
  iconTabletSize:
    label: Größe
    type: number
    after: px
    width: 1/4
  iconTabletRotate:
    label: Rotation
    type: number
    after: °
    width: 1/4
  desktopPosHead:
    label: Position + Größe (Desktop)
    type: headline
  iconDesktopX:
    label: X
    type: number
    after: px
    width: 1/4
  iconDesktopY:
    label: Y
    type: number
    after: px
    width: 1/4
  iconDesktopSize:
    label: Größe
    type: number
    after: px
    width: 1/4
  iconDesktopRotate:
    label: Rotation
    type: number
    after: °
    width: 1/4
