name: Q & A (FAQ)
icon: question
preview: fields

tabs:
  content:
    label: Inhalt
    icon: text
    fields:
      sectionInfo:
        label: Q & A
        type: info
        theme: blue
        text: >
          Frage-Antwort-Sektion mit optionalen Themengruppen.
          Die erste Frage jeder Gruppe ist beim Laden geöffnet.
      headlineInk:
        label: Headline (schwarz)
        type: text
        width: 1/2
      headlineAccent:
        label: Headline (blau)
        type: text
        width: 1/2
      groups:
        label: Themengruppen
        type: structure
        columns:
          title:
            width: 1/3
          questions:
            width: 2/3
        fields:
          title:
            label: Gruppentitel
            type: text
            placeholder: z. B. Über die School
          questions:
            label: Fragen
            type: structure
            fields:
              question:
                label: Frage
                type: text
              answer:
                label: Antwort
                type: textarea

  layout:
    extends: sections/block-layout-tab
  icon:
    extends: sections/block-icon-tab-v2
