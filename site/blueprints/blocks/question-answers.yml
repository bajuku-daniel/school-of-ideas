name: FAQ / Q&A (Akkordeon)
icon: question
description: Themengruppen mit aufklappbaren Fragen
preview: fields

tabs:
  content:
    label: Inhalt
    icon: text
    fields:
      sectionInfo:
        label: FAQ / Q&A — Frage-Antwort Akkordeon
        type: info
        theme: info
        text: >
          Layout: **Gruppentitel links, Akkordeon-Liste rechts.** Eine
          Sektion kann mehrere Themengruppen enthalten (z. B. "Über die
          School", "Das Programm"). Die ALLERERSTE Frage der ersten Gruppe
          ist beim Seitenaufruf bereits geöffnet. Alle anderen sind
          eingeklappt — Besucher öffnet sie via Klick auf die Frage.
      headlineInk:
        label: Headline (schwarz, optional)
        type: text
        width: 1/2
      headlineAccent:
        label: Headline (blau, optional)
        type: text
        width: 1/2
      groups:
        label: Themengruppen
        type: structure
        fields:
          title:
            label: Gruppen-Titel (links angezeigt)
            type: text
            placeholder: z. B. Über die School
          questions:
            label: Fragen in dieser Gruppe
            type: structure
            fields:
              question:
                label: Frage
                type: text
              answer:
                label: Antwort
                type: textarea
                help: >
                  Absätze mit Leerzeile trennen. **fett** und *kursiv* gehen
                  inline. Ganzer Absatz fett: Absatz mit ** umschließen.

  layout:
    extends: sections/block-layout-tab
  icon:
    extends: sections/block-icon-tab-v2
