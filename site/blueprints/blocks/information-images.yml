name: Team-Karten
icon: users
description: Karten mit Bild + Name + Funktion (klickbar)
preview: fields

tabs:
  content:
    label: Inhalt
    icon: text
    fields:
      sectionInfo:
        label: Team-/Personen-Karten
        type: info
        theme: blue
        text: >
          Karten-Grid mit Foto, Name und Position. Verlinkt optional auf
          eine externe URL. Eignet sich für Team-Übersichten,
          Mitarbeiter-Vorstellung oder Mentor:innen-Listen.
      headlineInk:
        label: Headline (schwarz, optional)
        type: text
        width: 1/2
      headlineAccent:
        label: Headline (blau, optional)
        type: text
        width: 1/2
      sub:
        label: Sub-Headline (optional)
        type: textarea
        buttons: false
      gridSettings:
        label: Grid-Einstellungen
        type: headline
      layout:
        label: Anordnung
        type: toggles
        default: grid
        width: 1/1
        options:
          grid: Gleichmäßiges Raster
          organic: Organisch (frei platziert)
      layoutInfo:
        label: Organische Anordnung
        type: info
        theme: passive
        when:
          layout: organic
        text: >
          Wie beim Agentur-Grid. Pro Person legst du unten **Spalte** und
          **Zeile** fest und wählst, ob der **Text rechts oder unter**
          dem Bild sitzt. Die Spaltenzahl steuerst du über „Spalten".
          Leer gelassene Karten werden automatisch der Reihe nach platziert.
          Auf dem Handy wird die organische Anordnung automatisch zu einer
          einfachen Liste.
      cols:
        label: Spalten
        type: number
        default: 3
        min: 2
        max: 6
        width: 1/2
      aspect:
        label: Bildformat
        type: toggles
        default: portrait
        width: 1/2
        options:
          portrait: Hochkant (3/4)
          square: Quadrat (1/1)
          landscape: Landscape (4/3)
      cards:
        label: Personen
        type: structure
        columns:
          name:
            width: 1/4
          position:
            width: 1/4
          image:
            width: 1/4
          col:
            label: Sp.
            width: 1/12
          row:
            label: Z.
            width: 1/12
        fields:
          image:
            label: Foto
            type: files
            max: 1
            uploads: image
            layout: cards
          name:
            label: Name, Vorname
            type: text
          position:
            label: Position
            type: text
            placeholder: z. B. "Creative Director"
          url:
            label: Link (optional)
            type: text
            placeholder: z. B. LinkedIn-Profil
          placement:
            label: "Platzierung (nur bei organischer Anordnung)"
            type: headline
          textPos:
            label: Text-Position
            type: toggles
            default: below
            width: 1/2
            options:
              below: Text drunter
              right: Text rechts
          col:
            label: Spalte
            type: number
            min: 1
            width: 1/4
            placeholder: auto
          row:
            label: Zeile
            type: number
            min: 1
            width: 1/4
            placeholder: auto

  layout:
    extends: sections/block-layout-tab
  icon:
    extends: sections/block-icon-tab-v2
