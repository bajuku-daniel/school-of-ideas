name: Headline + Bild (Seitenkopf)
icon: title
description: Große Headline, optional Bild rechts oder links (für Seitenköpfe)
preview: fields

# Geeignet als Seitenkopf für Unterseiten — große Headline links, Bild rechts
# (oder links / mittig / kein Bild). Layout pflegbar pro BP über Layout-Tab.
tabs:
  content:
    label: Inhalt
    icon: text
    fields:
      sectionInfo:
        label: Headline + Bild (Seitenkopf)
        type: info
        theme: info
        text: >
          Eignet sich als **Seitenkopf** oder Themenwechsel-Marker. Große
          Headline (schwarz + blau), optional mit Bild rechts oder links.
          Über das Layout-Toggle wählst du **mit Bild** oder **nur Headline**.

      kicker:
        label: Kicker (klein darüber, optional)
        type: text
        placeholder: z. B. "Kapitel 2"
      headlineInk:
        label: Headline (schwarz)
        type: textarea
        buttons: false
        help: >
          Für sauberen Umbruch: Zeilenumbrüche manuell mit Enter setzen
          (z. B. "Questions" Enter "& Answers" für Björns Design).
        width: 1/2
      headlineAccent:
        label: Headline (blau, optional)
        type: textarea
        buttons: false
        width: 1/2
      sub:
        label: Sub-Text (klein drunter, optional)
        type: textarea
        buttons: false

      layoutHead:
        label: Bild-Layout
        type: headline
      imageLayout:
        label: Wo soll das Bild sein?
        type: toggles
        default: right
        options:
          none: Kein Bild
          right: Rechts neben Headline
          left: Links neben Headline
          below: Unter Headline (zentriert)
        help: >
          "Kein Bild" macht den Block zum reinen Headline-Marker.
          "Rechts/Links" platziert das Bild neben der Headline.
      image:
        label: Bild (optional)
        help: >
          Wird nur angezeigt wenn das Bild-Layout oben auf "Rechts", "Links"
          oder "Unter Headline" steht. Wenn du "Kein Bild" gewählt hast, wird
          das hochgeladene Bild ignoriert (bleibt aber gespeichert).
        type: files
        max: 1
        uploads: image
        layout: cards
      imageAspect:
        label: Bildformat
        type: toggles
        default: landscape
        width: 1/2
        options:
          landscape: Landscape (16/11)
          square: Quadrat (1/1)
          portrait: Hochkant (3/4)
      align:
        label: Headline-Ausrichtung (nur wenn kein Bild)
        type: toggles
        default: left
        width: 1/2
        options:
          left: Links
          center: Zentriert
          right: Rechts

  layout:
    extends: sections/block-layout-tab
  shadow:
    extends: sections/block-shadow-tab
  icon:
    extends: sections/block-icon-tab-v2
