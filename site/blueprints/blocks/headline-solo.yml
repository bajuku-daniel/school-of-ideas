name: Headline-Solo
icon: title
preview: fields

# Inline-Edit: alle Felder direkt im Builder editierbar, KEIN Drawer.
# Häufig geänderte Felder oben, selten geänderte (Layout/Icon) drunter.
fields:
  sectionInfo:
    label: Headline-Solo
    type: info
    theme: blue
    text: >
      Einzelne Headline-Sektion ohne Body. Eignet sich als Themenwechsel-Marker
      zwischen anderen Sektionen.
  kicker:
    label: Kicker (klein darüber)
    type: text
    placeholder: z. B. "Kapitel 2"
  headlineInk:
    label: Headline (schwarz)
    type: textarea
    buttons: false
    width: 1/2
  headlineAccent:
    label: Headline (blau)
    type: textarea
    buttons: false
    width: 1/2
  sub:
    label: Sub-Text (klein drunter)
    type: textarea
    buttons: false
  align:
    label: Ausrichtung
    type: toggles
    default: left
    options:
      left: Links
      center: Zentriert
      right: Rechts

  # ============ Layout (selten geändert) ============
  layoutDivider:
    type: line
  layoutInfo:
    label: ◾ Layout & Abstände
    type: info
    theme: none
    text: Hintergrund, Anker-Link und Abstände. Leere Felder erben den Default.
  sectionTheme:
    label: Hintergrund
    type: toggles
    default: light
    width: 1/2
    options:
      light: Hell
      mint: Mint
      blue: Blau
  anchorId:
    label: Anker-ID (für #links)
    type: text
    width: 1/2
    placeholder: z. B. about
  spacingTopHead:
    label: Abstand oben (Mobile / Tablet / Desktop)
    type: headline
  spacingTopMobile:
    label: Mobile
    type: number
    after: px
    width: 1/3
  spacingTopTablet:
    label: Tablet
    type: number
    after: px
    width: 1/3
  spacingTopDesktop:
    label: Desktop
    type: number
    after: px
    width: 1/3
  spacingBottomHead:
    label: Abstand unten (Mobile / Tablet / Desktop)
    type: headline
  spacingBottomMobile:
    label: Mobile
    type: number
    after: px
    width: 1/3
  spacingBottomTablet:
    label: Tablet
    type: number
    after: px
    width: 1/3
  spacingBottomDesktop:
    label: Desktop
    type: number
    after: px
    width: 1/3

  # ============ Section-Icon (selten geändert) ============
  iconDivider:
    type: line
  iconInfo:
    label: ◾ Dekor-Icon (optional)
    type: info
    theme: none
    text: Icon aus Bibliothek wählen oder eigenes PNG hochladen. Anker bestimmt die Position.
  iconKey:
    extends: fields/icon-key
    width: 1/2
  iconRef:
    label: Bezug
    type: toggles
    default: section
    width: 1/2
    options:
      section: An der Sektion
      image: Am Bild
  iconAnchorY:
    label: Anker vertikal
    type: toggles
    default: top
    width: 1/2
    options:
      top: Oben
      middle: Mitte
      bottom: Unten
  iconAnchorX:
    label: Anker horizontal
    type: toggles
    default: right
    width: 1/2
    options:
      left: Links
      center: Mitte
      right: Rechts
  iconOffsetX:
    label: Offset X
    type: number
    after: px
    placeholder: 0
    width: 1/3
  iconOffsetY:
    label: Offset Y
    type: number
    after: px
    placeholder: 0
    width: 1/3
  iconRotate:
    label: Rotation
    type: number
    after: °
    placeholder: 0
    width: 1/3
  iconMobileSize:
    label: Größe Mobile
    type: number
    after: px
    placeholder: 60
    width: 1/3
  iconTabletSize:
    label: Größe Tablet
    type: number
    after: px
    placeholder: 90
    width: 1/3
  iconDesktopSize:
    label: Größe Desktop
    type: number
    after: px
    placeholder: 120
    width: 1/3
  iconMotion:
    label: Animation
    type: toggles
    default: wobble
    width: 1/2
    options:
      none: Keine
      wobble: Waber (4 Richtungen)
      glide: Glide (sanft)
  iconMotionDuration:
    label: Dauer
    type: number
    step: 0.1
    after: s
    placeholder: 6.5
    width: 1/4
  iconMotionDelay:
    label: Verzögerung
    type: number
    step: 0.1
    after: s
    placeholder: 0
    width: 1/4
  iconUploadHead:
    label: Eigene Uploads (optional, Override pro Breakpoint)
    type: headline
  iconMobile:
    label: Icon Mobile
    type: files
    max: 1
    uploads: image
    layout: cards
    width: 1/3
  iconTablet:
    label: Icon Tablet
    type: files
    max: 1
    uploads: image
    layout: cards
    width: 1/3
  iconDesktop:
    label: Icon Desktop
    type: files
    max: 1
    uploads: image
    layout: cards
    width: 1/3
