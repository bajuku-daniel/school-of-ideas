name: Hero (mit Video)
icon: video
description: Vollbild-Auftakt mit Hintergrundvideo + Headline
preview: fields

tabs:
  content:
    label: Inhalt
    icon: text
    fields:
      sectionInfo:
        label: Hero
        type: info
        theme: blue
        text: >
          Großer Eingangs-Block mit Video-Hintergrund und Headline mit
          optionalem Inline-Icon. Typischerweise erster Block einer Landingpage.
      heroLine1:
        label: Headline Zeile 1
        type: text
        placeholder: Kreativität hat
      line2Headline:
        label: Headline Zeile 2 mit Icon
        type: headline
      heroLine2Prefix:
        label: Vor dem Icon
        type: text
        placeholder: immer
        width: 1/3
      heroIcon:
        label: Icon aus Bibliothek
        type: select
        empty: Kein Icon
        width: 1/3
        help: "Verwendet /icons/png/<bp>/<key>.png. Eigene Datei unten überschreibt."
        options:
          airplane: Papierflieger
          bag: Tasche
          bottle: Flasche
          cloud: Wolke
          comet: Komet
          document: Dokument
          glasses: Brille
          glasses-bold: Brille (fett)
          leaf: Blatt
          lightbulb: Glühbirne
          lightning: Blitz
          pencil: Stift
          puzzle: Puzzle
          shooting-star: Sternschnuppe
          spark: Spark
          sparkles: Sparkles
          sparkles-line: Sparkles Linie
          star: Stern
          starlight: Sternlicht
          swirl: Wirbel
      heroLine2Suffix:
        label: Nach dem Icon
        type: text
        placeholder: Zukunft
        width: 1/3
      heroIconUpload:
        label: Hero-Icon eigene Datei (Override)
        type: files
        max: 1
        uploads: image
        layout: cards
        help: Wenn gesetzt, gewinnt diese Datei über die Bibliotheks-Auswahl.
      mediaHeadline:
        label: Medien
        type: headline
      heroPoster:
        label: Poster (Fallback-Bild)
        type: files
        max: 1
        uploads: image
        layout: cards
        width: 1/3
      heroVideo:
        label: Video Desktop (mp4)
        type: files
        max: 1
        uploads:
          template: image
        layout: cards
        width: 1/3
        help: Wird ab Tablet/Desktop ausgespielt.
      heroVideoMobile:
        label: Video Mobile (mp4)
        type: files
        max: 1
        uploads:
          template: image
        layout: cards
        width: 1/3
        help: Schmaleres Format für ≤ 768px.

  layout:
    extends: sections/block-layout-tab
  icon:
    extends: sections/block-icon-tab-v2
