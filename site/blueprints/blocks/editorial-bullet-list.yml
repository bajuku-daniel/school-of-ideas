name: Bullet-Liste (Items mit Icons)
icon: list-bullet
description: Headline + Liste mit blauen Punkten oder Custom-Icons
preview: fields

tabs:
  content:
    label: Inhalt
    icon: text
    fields:
      sectionInfo:
        label: Editorial Bullet-List
        type: info
        theme: blue
        text: >
          Headline + optionale Sub-Headline + Bullet-Liste (blaue Punkte).
          Items können frei im 4er-Grid positioniert werden (Spalte/Zeile).
      headlineInk:
        label: Headline (schwarz)
        type: text
        width: 1/2
      headlineAccent:
        label: Headline (blau)
        type: text
        width: 1/2
      sub:
        label: Sub-Headline (optional)
        type: textarea
        buttons: false
      bulletHead:
        label: Aufzählungs-Icon
        type: headline
      bulletInfo:
        label: Default = blauer Punkt
        type: info
        text: >
          Ohne Auswahl wird vor jedem Item ein blauer Kreis gezeigt. Wenn du
          einen Library-Eintrag wählst oder eine eigene Datei hochlädst,
          wird dieses Icon stattdessen verwendet.
      bulletKey:
        extends: fields/icon-key
        label: Aus Bibliothek
        empty: "Blauer Punkt (Default)"
        width: 1/2
      bulletUpload:
        label: Eigene Datei (Override)
        type: files
        max: 1
        uploads: image
        layout: cards
        width: 1/2
      items:
        label: Bullet-Items
        type: structure
        columns:
          text:
            width: 2/3
          col:
            width: 1/6
          row:
            width: 1/6
        fields:
          text:
            label: Text
            type: textarea
            buttons: false
          col:
            label: Spalte (1–4)
            type: number
            min: 1
            max: 4
            default: 1
          row:
            label: Zeile (1–N)
            type: number
            min: 1
            default: 1

  layout:
    extends: sections/block-layout-tab
  icon:
    extends: sections/block-icon-tab-v2
