name: Text-Liste (färbbar, ohne Punkte)
icon: list-bullet
description: Headline + Text-Items im Raster — blau/schwarz färbbar, ohne Aufzählungspunkte
preview: fields

tabs:
  content:
    label: Inhalt
    icon: text
    fields:
      sectionInfo:
        label: Text-Liste
        type: info
        theme: blue
        text: >
          Headline + optionale Sub-Headline + Text-Items im 4er-Raster (frei
          positionierbar über Spalte/Zeile). **Keine Aufzählungspunkte** —
          reiner Text. Färben: **--Text--** = blau, sonst schwarz. **Enter** im
          Item = Zeilenumbruch (z. B. blaue Titel-Zeile, schwarze Beschreibung
          darunter).
      headlineInk:
        label: Headline (schwarz)
        type: text
        width: 1/2
      headlineAccent:
        label: Headline (blau)
        type: text
        width: 1/2
      sub:
        label: Sub-Headline (optional)
        type: textarea
        buttons: false
      items:
        label: Text-Items
        type: structure
        columns:
          text:
            width: 2/3
          col:
            width: 1/6
          row:
            width: 1/6
        fields:
          text:
            label: Text
            type: textarea
            buttons: false
            help: >
              --Text-- = blau, sonst schwarz. **fett**, *kursiv* möglich.
              Enter = Zeilenumbruch (Titel-Zeile / Beschreibung).
          col:
            label: Spalte (1–4)
            type: number
            min: 1
            max: 4
            default: 1
          row:
            label: Zeile (1–N)
            type: number
            min: 1
            default: 1

  layout:
    extends: sections/block-layout-tab
  icon:
    extends: sections/block-icon-tab-v2
