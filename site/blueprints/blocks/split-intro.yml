name: Split-Intro
icon: rectangle-vertical
preview: fields

tabs:
  content:
    label: Inhalt
    icon: text
    fields:
      sectionInfo:
        label: Split-Intro
        type: info
        theme: blue
        text: >
          Zwei-spaltiger Einstieg: links Headline + Bild, rechts Sub-Headline,
          Fließtext und CTAs. Verwendet z. B. direkt unter dem Hero.
      headlineInk:
        label: Headline (schwarz)
        type: textarea
        buttons: false
        width: 1/2
      headlineAccent:
        label: Headline (blau)
        type: textarea
        buttons: false
        width: 1/2
      sub:
        label: Sub-Headline (fett)
        type: textarea
        buttons: false
      body:
        label: Fließtext
        type: textarea
        help: >
          Absätze mit Leerzeile trennen. **fett** und *kursiv* inline möglich.
          Ganzer Absatz fett/groß: kompletten Absatz mit ** umschließen.
      imageHeadline:
        label: Bild
        type: headline
      image:
        label: Bild
        type: files
        max: 1
        uploads: image
        layout: cards
      imageSpacingHead:
        label: Abstand Bild → Headline (oberhalb des Bildes)
        type: headline
        help: >
          Vertikaler Abstand zwischen der Headline und dem Bild darunter.
          Felder leer lassen für den Standard-Wert (Mobile ~48px, Tablet ~180px, Desktop ~285px).
      motivSpacingTopMobile:
        label: Mobile
        type: number
        after: px
        placeholder: 48
        width: 1/3
      motivSpacingTopTablet:
        label: Tablet
        type: number
        after: px
        placeholder: 180
        width: 1/3
      motivSpacingTopDesktop:
        label: Desktop
        type: number
        after: px
        placeholder: 285
        width: 1/3
      ctaHeadline:
        label: Buttons
        type: headline
      ctaPrimaryText:
        label: Primary-Button Text
        type: text
        width: 1/4
      ctaPrimaryUrl:
        label: Primary-Button Link
        type: text
        width: 1/4
      ctaSecondaryText:
        label: Ghost-Link Text
        type: text
        width: 1/4
      ctaSecondaryUrl:
        label: Ghost-Link URL
        type: text
        width: 1/4

  layout:
    extends: sections/block-layout-tab
  icon:
    extends: sections/block-icon-tab-v2
  shadow:
    extends: sections/block-shadow-tab
