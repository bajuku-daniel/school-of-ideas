name: Editorial (Headline + 1, 2 oder 3 Spalten)
icon: dashboard
description: Headline + variable Text-Spalten, optional mit Bild
preview: fields

tabs:
  content:
    label: Inhalt
    icon: text
    fields:
      sectionInfo:
        label: Editorial Split-Intro
        type: info
        theme: blue
        text: >
          Sektion mit Headline (schwarz + blau) und 1/2/3 Spalten Text.
          Optional Bild + Sub-Headline. Für mehr Bild-Kontrolle (Breite,
          Offset, separater Schatten) kann alternativ der "Bild"-Block
          benutzt werden.
      layout:
        label: Spalten-Layout
        type: toggles
        default: '1col'
        options:
          1col: 1 Spalte (mit Bild)
          2col: 2 Spalten (Lead + Body, mit Bild)
          3col: 3 Spalten (Textgrid)
      headlineInk:
        label: Headline (schwarz)
        type: text
        width: 1/2
      headlineAccent:
        label: Headline (blau)
        type: text
        width: 1/2
      sub:
        label: Sub-Headline (fett, optional)
        type: textarea
        buttons: false
        when:
          layout: 1col
      body:
        label: Fließtext
        type: textarea
        help: >
          Absätze mit Leerzeile trennen.
          Inline-Formatierung: **fett**, *kursiv*.
          Ganzer Absatz fett/groß: den ganzen Absatz mit ** umschließen
          (z. B. **Diesen Absatz größer**). Inline mit *...* bleibt nur kursiv.
        when:
          layout: 1col
      columns:
        label: Spalten
        type: structure
        columns:
          lead:
            width: 1/2
          body:
            width: 1/2
        fields:
          lead:
            label: Lead (fett)
            type: textarea
            buttons: false
          body:
            label: Body (regular)
            type: textarea
            help: >
              Absätze mit Leerzeile trennen. **fett** und *kursiv* gehen inline. --blau-Akzent-- für inline Markenfarbe.
              Ganzer Absatz fett/groß: Absatz komplett mit ** umschließen.
          ctaText:
            label: Link-Text (optional)
            type: text
            help: Wenn gefüllt, erscheint ein Link/Button am Ende der Spalte.
            width: 1/2
          ctaLinkType:
            label: Link-Ziel
            type: toggles
            default: url
            width: 1/2
            options:
              url: Seite / URL
              mail: E-Mail schreiben
          ctaUrl:
            label: Link-URL
            type: text
            placeholder: z. B. /programm oder #anchor
            width: 1/1
            when:
              ctaLinkType: url
          ctaEmail:
            label: E-Mail-Adresse
            type: email
            placeholder: z. B. hallo@school-of-ideas.de
            width: 1/2
            when:
              ctaLinkType: mail
          ctaSubject:
            label: Betreff (optional)
            type: text
            placeholder: z. B. Bewerbung School of Ideas
            width: 1/2
            when:
              ctaLinkType: mail
          ctaBody:
            label: Nachricht-Vorlage (optional)
            type: textarea
            buttons: false
            help: >
              Öffnet sich vorausgefüllt im Mailprogramm der Besucher:innen.
              Zeilenumbrüche werden übernommen.
            when:
              ctaLinkType: mail
          ctaStyle:
            label: Stil
            type: toggles
            default: link
            options:
              link: Link (unterstrichen, blau)
              ghost: Ghost (umrandet)
              mint: Mint-Button (gefüllt)
      imageHeadline:
        label: Bild (optional)
        type: headline
      image:
        label: Bild
        type: files
        max: 1
        uploads: image
        layout: cards

  layout:
    extends: sections/block-layout-tab
  icon:
    extends: sections/block-icon-tab-v2
  shadow:
    extends: sections/block-shadow-tab
