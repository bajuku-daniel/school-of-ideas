name: Highlight-Statement
icon: quote
description: Großer Aussage-Text mit Inline-Icons (z.B. Manifest)
preview: fields

tabs:
  content:
    label: Inhalt
    icon: text
    fields:
      sectionInfo:
        label: Highlight-Text mit Inline-Icons
        type: info
        theme: blue
        text: >
          Lange Statement-Absätze mit Inline-Icons. Icons werden im Text per
          `{icon:name}` referenziert (z. B. `{icon:airplane}`). Die Icons selbst
          legst du unten im "Icon-Pool" ab.
      breaksInfo:
        label: Feste Umbrüche & automatische Größe
        type: info
        theme: positive
        text: >
          **Jede neue Zeile (Enter) = fester Umbruch.** Der Text bricht NUR dort um,
          wo du Enter drückst — nie von allein. Die Schriftgröße wird automatisch so
          berechnet, dass die längste Zeile genau die Spaltenbreite füllt. So ist die
          Sektion auf jeder Bildschirmgröße exakt gleich aufgebaut.
      paragraphs:
        label: Absätze
        type: structure
        columns:
          text:
            width: 1/1
        fields:
          text:
            label: Text (Desktop-Umbrüche)
            type: textarea
            buttons: false
            help: >
              Jede Zeile = fester Umbruch (Enter drücken). Inline-Icons mit Token,
              z. B. `{icon:airplane}` (Namen aus dem Icon-Pool unten).
          textMobile:
            label: Text (Mobile-Umbrüche, optional)
            type: textarea
            buttons: false
            help: >
              Eigene Umbrüche fürs Handy. Leer lassen = die Desktop-Umbrüche
              werden auch auf Mobile genutzt.
      sizeHeadline:
        label: Spaltenbreite & Größen-Grenzen (optional)
        type: headline
      sizeInfo:
        label: Wann brauchst du das?
        type: info
        text: >
          Normalerweise nichts einstellen nötig — die Schrift skaliert von allein.
          Diese Werte sind nur Feinjustierung bzw. Sicherheitsnetze. Leer = sinnvoller
          Default.
      fitWidthDesktop:
        label: Spaltenbreite Desktop
        type: number
        after: px
        width: 1/2
        placeholder: z. B. 1100
        help: Wie breit der Textblock auf großen Screens werden darf.
      fitWidthMobile:
        label: Spaltenbreite Mobile
        type: number
        after: px
        width: 1/2
        help: Leer = ca. 86 % der Bildschirmbreite.
      fitFontMaxDesktop:
        label: Max. Schrift Desktop
        type: number
        after: px
        width: 1/3
        help: Obergrenze, damit die Schrift nicht zu groß wird.
      fitFontMaxMobile:
        label: Max. Schrift Mobile
        type: number
        after: px
        width: 1/3
      fitFontMin:
        label: Min. Schrift
        type: number
        after: px
        width: 1/3
        help: Untergrenze, damit es nie zu klein wird.
      iconPoolHeadline:
        label: Icon-Pool (lokal in dieser Sektion)
        type: headline
      iconPool:
        label: Icons in diesem Block
        type: structure
        columns:
          key:
            width: 1/2
          file:
            width: 1/2
        fields:
          key:
            label: Token-Name
            type: slug
            help: Im Text als `{icon:NAME}` verwendet. Nur Kleinbuchstaben + Bindestriche.
          file:
            label: PNG/SVG
            type: files
            max: 1
            uploads:
              template: image
            layout: cards
            image:
              cover: false
              back: white

  inlineicons:
    label: Inline-Icons
    icon: sparkles
    fields:
      inlineInfo:
        label: Icons mitten im Text
        type: info
        theme: blue
        text: >
          Feinjustierung der Icons IM TEXT (z. B. Papierflieger). Pro Breakpoint
          einstellbar — leer = sinnvoller Default. Das frei schwebende Deko-Icon
          stellst du im Tab „Section-Icon" ein, den Abstand der ganzen Sektion
          oben/unten im Tab „Layout".
      strokeHead:
        label: Strichstärke (Linienstärke der Icons)
        type: headline
      iconStrokeMobile:
        label: Mobile
        type: number
        placeholder: "26"
        width: 1/3
      iconStrokeTablet:
        label: Tablet
        type: number
        placeholder: "24"
        width: 1/3
      iconStrokeDesktop:
        label: Desktop
        type: number
        placeholder: "24"
        width: 1/3
      sizeHead:
        label: Größe (× Schriftgröße)
        type: headline
      iconSizeMobile:
        label: Mobile
        type: number
        step: 0.01
        after: "× Schrift"
        placeholder: "1.22"
        width: 1/3
      iconSizeTablet:
        label: Tablet
        type: number
        step: 0.01
        after: "× Schrift"
        placeholder: "1.32"
        width: 1/3
      iconSizeDesktop:
        label: Desktop
        type: number
        step: 0.01
        after: "× Schrift"
        placeholder: "1.32"
        width: 1/3
      gapHead:
        label: Abstand links/rechts um jedes Icon
        type: headline
      iconGapMobile:
        label: Mobile
        type: number
        step: 0.02
        after: em
        placeholder: "0.16"
        width: 1/3
      iconGapTablet:
        label: Tablet
        type: number
        step: 0.02
        after: em
        placeholder: "0.2"
        width: 1/3
      iconGapDesktop:
        label: Desktop
        type: number
        step: 0.02
        after: em
        placeholder: "0.2"
        width: 1/3
      liftHead:
        label: Vertikale Lage (höher = Icon weiter nach oben)
        type: headline
      iconLiftMobile:
        label: Mobile
        type: number
        step: 0.02
        after: em
        placeholder: "0.76"
        width: 1/3
      iconLiftTablet:
        label: Tablet
        type: number
        step: 0.02
        after: em
        placeholder: "0.82"
        width: 1/3
      iconLiftDesktop:
        label: Desktop
        type: number
        step: 0.02
        after: em
        placeholder: "0.82"
        width: 1/3

  layout:
    extends: sections/block-layout-tab
  icon:
    extends: sections/block-icon-tab-v2
