name: Bild (einzeln, mit Schatten)
icon: image
description: Stand-Alone-Bild mit blauem Schlagschatten
preview: fields

tabs:
  content:
    label: Inhalt
    icon: image
    fields:
      sectionInfo:
        label: Stand-Alone-Bild
        type: info
        theme: blue
        text: >
          Einzelnes Bild mit dem typischen blauen Schlagschatten und
          schräger Rotation. Format wählbar (landscape/square/portrait/custom).
      aspect:
        label: Bildformat
        type: toggles
        default: landscape
        options:
          landscape: Landscape (16/11)
          square: Quadrat (1/1)
          portrait: Hochkant (3/4)
          custom: Eigene Aspect-Ratio
      aspectCustom:
        label: Aspect-Ratio (Breite / Höhe)
        type: text
        placeholder: z. B. 4 / 3
        when:
          aspect: custom
      align:
        label: Ausrichtung
        type: toggles
        default: center
        options:
          left: Links
          center: Zentriert
          right: Rechts
      image:
        label: Bild
        type: files
        max: 1
        uploads: image
        layout: cards
      caption:
        label: Bildunterschrift (optional)
        type: text

      sizeHead:
        label: Bildbreite & Position (Feinjustierung)
        type: headline
      sizeInfo:
        label: Wie viel Platz nimmt das Bild ein?
        type: info
        text: >
          **Breite** in % der Container-Breite (z. B. 60 = 60% breit).
          **Offset X/Y** verschiebt das Bild relativ zur Ausrichtung
          (z. B. um es leicht außerhalb der zentrierten Position zu setzen).
          Leer = Default-Layout.
      widthDesktop:
        label: Breite Desktop
        type: number
        after: '%'
        placeholder: 100
        width: 1/3
        min: 10
        max: 100
      widthTablet:
        label: Breite Tablet
        type: number
        after: '%'
        placeholder: 100
        width: 1/3
        min: 10
        max: 100
      widthMobile:
        label: Breite Mobile
        type: number
        after: '%'
        placeholder: 100
        width: 1/3
        min: 10
        max: 100
      offsetX:
        label: Offset X (horizontal)
        type: number
        after: px
        placeholder: 0
        width: 1/2
        help: + nach rechts, − nach links
      offsetY:
        label: Offset Y (vertikal)
        type: number
        after: px
        placeholder: 0
        width: 1/2
        help: + nach unten, − nach oben

  layout:
    extends: sections/block-layout-tab
  shadow:
    extends: sections/block-shadow-tab
  icon:
    extends: sections/block-icon-tab-v2
