name: Hero mit Foto
icon: image
description: Großer Auftakt mit Foto rechts + Headline links
preview: fields

tabs:
  content:
    label: Inhalt
    icon: text
    fields:
      displayMode:
        label: Darstellung
        type: toggles
        default: foto
        options:
          foto: Foto + Text nebeneinander
          vollbild: Vollbild (wie Video-Hero)
        help: >
          „Vollbild" verhält sich exakt wie der Video-Hero — formatfüllend (16:9),
          Text unten links in Weiß, Nav wird beim Rausscrollen zu Glas — nur mit
          dem Foto als Hintergrund statt Video.
      sectionInfo:
        label: Hero-Foto
        type: info
        theme: blue
        text: >
          „Foto + Text": Foto rechts mit blauem Schlagschatten, Headline links.
          „Vollbild": Foto formatfüllend als Hintergrund, Headline unten links —
          identisch zum Video-Hero. Format (16:9) und Textfarbe sind im Vollbild-
          Modus fix; Foto-Format, Sub-Text und Bild-Schatten gelten nur im
          „Foto"-Modus.
      heroLine1:
        label: Headline Zeile 1
        type: text
        placeholder: Hier lernst du
      line2Headline:
        label: Headline Zeile 2 mit Icon
        type: headline
      heroLine2Prefix:
        label: Vor dem Icon
        type: text
        placeholder: was
        width: 1/3
      heroIcon:
        label: Icon aus Bibliothek
        type: select
        empty: Kein Icon
        width: 1/3
        help: Lädt aus /icons/png/desktop/<key>.png
        options:
          airplane: Papierflieger
          bag: Tasche
          bottle: Flasche
          cloud: Wolke
          comet: Komet
          document: Dokument
          glasses: Brille
          glasses-bold: Brille (fett)
          leaf: Blatt
          lightbulb: Glühbirne
          lightning: Blitz
          pencil: Stift
          puzzle: Puzzle
          shooting-star: Sternschnuppe
          spark: Spark
          sparkles: Sparkles
          sparkles-line: Sparkles Linie
          star: Stern
          starlight: Sternlicht
          swirl: Wirbel
      heroLine2Suffix:
        label: Nach dem Icon
        type: text
        placeholder: Kreativarbeit
        width: 1/3
      heroIconUpload:
        label: Hero-Icon eigene Datei (Override)
        type: files
        max: 1
        uploads: image
        layout: cards
      sub:
        label: Sub-Text (unter Headline)
        type: textarea
        buttons: false
        when:
          displayMode: foto
      photoHeadline:
        label: Foto
        type: headline
      photo:
        label: Foto
        type: files
        max: 1
        uploads: image
        layout: cards
        image:
          cover: true
        help: >
          Im „Foto"-Modus rechts als Tile, im „Vollbild"-Modus formatfüllend als
          Hintergrund. Für Vollbild ein quer-/breitformatiges Motiv wählen.
      aspect:
        label: Foto-Format
        type: toggles
        default: landscape
        when:
          displayMode: foto
        options:
          landscape: Landscape (16/11)
          square: Quadrat (1/1)
          portrait: Hochkant (3/4)

  layout:
    extends: sections/block-layout-tab
  shadow:
    extends: sections/block-shadow-tab
  icon:
    extends: sections/block-icon-tab-v2
